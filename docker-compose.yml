services:
  vsphere-mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: vsphere-mcp-server:local
    container_name: vsphere-mcp-server
    restart: unless-stopped
    # Container listens on 8000 internally; host exposes loopback 8010 -> 8000.
    # To make it reachable on the LAN, change 127.0.0.1:8010 to 0.0.0.0:8010.
    ports:
      - "127.0.0.1:8010:8000"
    env_file:
      - .env
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "8000"
    networks:
      - vsphere-mcp-network

networks:
  vsphere-mcp-network:
    driver: bridge